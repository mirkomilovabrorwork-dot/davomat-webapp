<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davomat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #6b6b70);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 24px 16px; box-sizing: border-box;
    text-align: center; }
  #status { max-width: 320px; }
  .spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--hint);
    border-top-color: var(--accent); animation: r 0.9s linear infinite; }
  .spin[hidden], button[hidden] { display: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 24px;
    background: var(--accent); color: var(--accent-fg); }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <div id="status" role="status">Joylashuv aniqlanmoqda...</div>
  <button id="settings" hidden>Ruxsat berish</button>
</main>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  var statusEl = document.getElementById("status");
  var spin = document.getElementById("spin");

  function show(text, busy) {
    statusEl.textContent = text;
    spin.hidden = !busy;
  }
  var done = false;
  function send(lat, lon, acc) {
    if (done) { return; }
    done = true;
    show("Yuborilmoqda...", true);
    tg.sendData(JSON.stringify({
      v: 1, lat: lat, lon: lon,
      acc: (typeof acc === "number") ? acc : null
    }));
  }
  // never close silently: the bot replies with the reason
  function fail(code) {
    if (done) { return; }
    done = true;
    tg.sendData(JSON.stringify({ v: 1, err: code }));
  }

  if (!tg) { return show("Bu sahifa faqat Telegram ichida ishlaydi.", false); }
  tg.ready();
  tg.expand();

  // 1) a FRESH fix from the device (maximumAge 0). Telegram's LocationManager
  //    can return a minutes-old cached point (measured 10-17: same coords x15).
  // 2) LocationManager only if the fresh fix fails; 3) hard stop at 20 s.
  var lm = tg.LocationManager;
  var lmFix = null, lmDone = false, browserFailed = false;
  function fallback() {
    if (lmFix) { return send(lmFix.latitude, lmFix.longitude, lmFix.horizontal_accuracy); }
    if (!lmDone) { return; }
    if (lm && lm.isAccessRequested && !lm.isAccessGranted) { return denied(); }
    fail("nogps");
  }
  // the bot itself was denied location inside Telegram: phone settings cannot fix it,
  // only Telegram's per-bot setting can, and openSettings() needs a user tap
  function denied() {
    if (done) { return; }
    done = true;
    show("Botga joylashuv ruxsati berilmagan. Pastdagi tugmani bosing, ruxsat bering, " +
         "so'ng oynani yopib «Keldim / Ketdim»ni qayta bosing.", false);
    var btn = document.getElementById("settings");
    btn.hidden = false;
    btn.onclick = function () { lm.openSettings(); };
  }
  // Indoors the first fix is often a coarse Wi-Fi/cell guess (measured 10-21:
  // the same +-200 m point 7 taps in a row, real GPS +-32 m a minute later).
  // Watch for up to 15 s: send at once when a fix is good, else the best one seen.
  var GOOD_M = 50, WAIT_MS = 15000, best = null, watchId = null;
  function sendBest() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); }
    send(best.coords.latitude, best.coords.longitude, best.coords.accuracy);
  }
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(function (p) {
      if (done) { return; }
      if (!best || p.coords.accuracy < best.coords.accuracy) { best = p; }
      if (p.coords.accuracy <= GOOD_M) { return sendBest(); }
      show("GPS ushlanyapti, biroz kuting... (aniqlik ±" + Math.round(p.coords.accuracy) + " m)", true);
    }, function () {
      if (done) { return; }
      if (best) { return sendBest(); }
      browserFailed = true; fallback();
    }, { enableHighAccuracy: true, timeout: WAIT_MS, maximumAge: 0 });
    setTimeout(function () { if (best && !done) { sendBest(); } }, WAIT_MS);
  } else { browserFailed = true; }

  // the SDK defines LocationManager even on clients older than Bot API 8.0
  if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
    lm.init(function () {
      if (!lm.isLocationAvailable) { lmDone = true; return browserFailed && fallback(); }
      lm.getLocation(function (data) {
        lmFix = data || null;
        lmDone = true;
        if (browserFailed) { fallback(); }
      });
    });
  } else { lmDone = true; if (browserFailed) { fallback(); } }

  setTimeout(function () {
    if (lmFix) { return send(lmFix.latitude, lmFix.longitude, lmFix.horizontal_accuracy); }
    fail("timeout");
  }, 20000);
})();
</script>
</body>
</html>
