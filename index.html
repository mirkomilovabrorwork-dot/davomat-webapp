<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davomat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #6b6b70);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 24px 16px; box-sizing: border-box;
    text-align: center; }
  #status { max-width: 320px; }
  .spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--hint);
    border-top-color: var(--accent); animation: r 0.9s linear infinite; }
  .spin[hidden], button[hidden] { display: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 24px;
    background: var(--accent); color: var(--accent-fg); }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <div id="status" role="status">Joylashuv aniqlanmoqda...</div>
  <button id="settings" hidden>Sozlamalarni ochish</button>
</main>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  var statusEl = document.getElementById("status");
  var spin = document.getElementById("spin");
  var settingsBtn = document.getElementById("settings");

  function show(text, busy) {
    statusEl.textContent = text;
    spin.hidden = !busy;
  }
  function send(lat, lon, acc) {
    show("Yuborilmoqda...", true);
    tg.sendData(JSON.stringify({
      v: 1, lat: lat, lon: lon,
      acc: (typeof acc === "number") ? acc : null
    }));
  }
  function viaBrowser() {
    if (!navigator.geolocation) {
      return show("Telegram'ni yangilang yoki joylashuvni yoqing.", false);
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      send(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    }, function () {
      show("Telegram'ni yangilang yoki joylashuvni yoqing.", false);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  if (!tg) { return show("Bu sahifa faqat Telegram ichida ishlaydi.", false); }
  tg.ready();
  tg.expand();
  var lm = tg.LocationManager;
  // the SDK defines LocationManager even on clients older than Bot API 8.0
  if (!lm || !tg.isVersionAtLeast || !tg.isVersionAtLeast("8.0")) { return viaBrowser(); }
  lm.init(function () {
    if (!lm.isLocationAvailable) { return viaBrowser(); }
    lm.getLocation(function (data) {
      if (data === null) {
        show("Joylashuvga ruxsat bering", false);
        settingsBtn.hidden = false;
        settingsBtn.onclick = function () { lm.openSettings(); };
        return;
      }
      var acc = (typeof data.horizontal_accuracy === "number") ? data.horizontal_accuracy : null;
      send(data.latitude, data.longitude, acc);
    });
  });
})();
</script>
</body>
</html>
